name: Check admin security and migrations
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-security-check.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safecar_test
          POSTGRES_USER: safecar_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safecar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SAFECAR_TEST_DATABASE_URL: postgresql://safecar_test:disposable-ci-only@localhost:5432/safecar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest tests -q
